html,body{height:100%}
body{overflow-x:clip}
.side,.mapwrap{min-width:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:minmax(320px,390px) 1fr;height:100%;min-height:0}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.head{padding-block:20px 14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;color:var(--accent)}
h1{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.02;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0;max-width:34ch}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:600;font-size:13px;border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:8px;cursor:pointer;display:flex;justify-content:center;gap:6px;align-items:baseline}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .ct{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45}
.list{overflow:auto;min-height:0;flex:1;padding-block:6px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.grp{margin-top:14px}
.grp h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0 8px 4px;color:var(--muted);display:flex;align-items:center;gap:8px}
.grp h2 .dot{width:8px;height:8px;border-radius:50%}

const S0=55.690,W0=37.500;
const AL='0123456789abcdefghijklmnopqrstuv',AC='ABCDEFGHIJKLMNOPQRSTUVWXYZwxyz_$';
function dec(s){const v=[];let i=0;while(i<s.length){let x=0,m=1;while(AC.indexOf(s[i])>=0){x+=AC.indexOf(s[i])*m;m*=32;i++}x+=AL.indexOf(s[i])*m;i++;v.push(x%2?-(x+1)/2:x/2)}const p=[];let a=0,o=0;for(let k=0;k<v.length;k+=2){a+=v[k];o+=v[k+1];p.push([S0+a*2e-5,W0+o*2e-5])}return p}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const map=L.map('map',{preferCanvas:true,zoomSnap:.5,minZoom:12,maxZoom:18,maxBounds:[[55.682,37.485],[55.772,37.65]],maxBoundsViscosity:.8});

const rend=L.canvas({padding:.3});
const baseLayers={};
function drawBase(){
  Object.values(baseLayers).forEach(l=>map.removeLayer(l));
  const g=(k,fn)=>{const grp=L.layerGroup();BASE[k].split(' ').filter(Boolean).forEach(s=>{const p=dec(s);if(p.length>1)grp.addLayer(fn(p))});grp.addTo(map);baseLayers[k]=grp};
  g('green',p=>L.polygon(p,{renderer:rend,stroke:false,fillColor:css('--park'),fillOpacity:1,interactive:false}));
  g('water',p=>L.polygon(p,{renderer:rend,stroke:false,fillColor:css('--water'),fillOpacity:1,interactive:false}));
  g('bld',p=>L.polygon(p,{renderer:rend,stroke:false,fillColor:css('--bld'),fillOpacity:1,interactive:false}));
  g('rail',p=>L.polyline(p,{renderer:rend,color:css('--rail'),weight:1.4,dashArray:'5 4',interactive:false}));
  g('minor',p=>L.polyline(p,{renderer:rend,color:css('--road2'),weight:2,lineCap:'round',interactive:false}));
  g('major',p=>L.polyline(p,{renderer:rend,color:css('--road'),weight:4,lineCap:'round',interactive:false}));
  sizeRoads();
}
function sizeRoads(){const z=map.getZoom();const f=Math.pow(1.6,z-14);
  baseLayers.minor&&baseLayers.minor.eachLayer(l=>l.setStyle({weight:Math.max(.8,2.2*f)}));
  baseLayers.major&&baseLayers.major.eachLayer(l=>l.setStyle({weight:Math.max(1.6,4.5*f)}));}

const LUCAT={'Рестораны и кафе':'food','Красота и здоровье':'beauty','Развлечения и шопинг':'fun','Дети':'kids'};
const LUCOL={sport:'--c-sport',food:'--c-food',beauty:'--c-beauty',fun:'--c-fun',kids:'--c-kids'};
const LUNAME={sport:'Спорт',food:'Рестораны и кафе',beauty:'Красота и здоровье',fun:'Развлечения и шопинг',kids:'Детям'};
const luCat=it=>LUCAT[it.sub]||'sport';
const ZCLS=[['bus','Бизнес'],['prem','Премиум'],['dlx','Делюкс'],['elt','Элитный'],['lux','Люкс']];
const ZCN=Object.fromEntries(ZCLS);
const ZDUE=[['26','до 2026',y=>y<=2026],['27','2027',y=>y===2027],['28','2028',y=>y===2028],['29','2029 и позже',y=>y>=2029]];
const HOUSE='<svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>';
const PMIN=Math.floor(Math.min(...ZHK.filter(z=>z.pa).map(z=>z.pa))/10)*10, PMAX=Math.ceil(Math.max(...ZHK.filter(z=>z.pa).map(z=>z.pa))/10)*10;
const vToP=v=>Math.round(PMIN*Math.pow(PMAX/PMIN,v/1000)/10)*10;

/* ---------- state ---------- */
let tab='kh', off=new Set(), q='', showZ=true, showI=true;
const zOff=new Set(), zDue=new Set(); let pLo=0,pHi=1000;
const open=new Set(['zhk']);
const markers={kh:[],lu:[],z:[]}; const layer={kh:L.layerGroup(),lu:L.layerGroup(),z:L.layerGroup()};
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
function match(txt){if(!q)return true;const h=norm(txt);return norm(q).split(/\s+/).every(w=>h.includes(w))}

/* ---------- popups ---------- */
function icon(n,col,ap){return L.divIcon({className:'',html:`<div class="mk${ap?' ap':''}" style="background:var(${col})">${n}</div>`,iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-12]})}
function popKh(it){return `<div class="pp"><div class="k">№ ${it.n} · ${esc(DATA.cats[it.cat])}</div><div class="t">${esc(it.name)}</div><div class="a">${esc(it.sub)}${it.approx?'':' · '+esc(it.addr)}</div>${it.approx?`<div class="w">Примерное место: ${esc(it.addr)}. Точный адрес уточняется.</div>`:''}</div>`}
const LUBY={};DATA.lu.forEach(x=>{(LUBY[x.n]=LUBY[x.n]||[]).push(x)});
function popB(b){const rows=b.items.map(n=>{const it=(LUBY[n]||[])[0];if(!it)return'';return `<li><span class="badge" style="background:var(${LUCOL[luCat(it)]})">${n}</span><span>${esc(it.name)}</span></li>`}).join('');
  return `<div class="pp"><div class="k">Объект ${b.id} · ${b.items.length} услуг</div><div class="t">${esc(b.name)}</div><ul>${rows}</ul></div>`}
function popLu(it){const b=it.b?DATA.lub.find(x=>x.id===it.b):null;return `<div class="pp"><div class="k">№ ${it.n} · ${esc(LUNAME[luCat(it)])}</div><div class="t">${esc(it.name)}</div><div class="a">${b?'Здание '+b.id+': '+esc(b.name):'ОК «Лужники»'}</div></div>`}
function zPrice(z){if(!z.pa)return'';return z.pm&&z.pm!==z.pa?'от '+fmtN(z.pm)+', в среднем '+fmtN(z.pa)+' тыс. ₽':fmtN(z.pa)+' тыс. ₽'}
function popZ(z){const r=(k,v)=>v?`<tr><td>${k}</td><td>${esc(v)}</td></tr>`:'';
  const lots=z.pl!=null?(z.ph!=null&&z.ph!==z.pl?'от '+z.pl.toLocaleString('ru-RU')+' до '+z.ph.toLocaleString('ru-RU')+' млн ₽':z.pl.toLocaleString('ru-RU')+' млн ₽'):'';
  return `<div class="pp"><div class="k"><span class="clsdot" style="background:var(--k-${z.cat})"></span>${esc(ZCN[z.cat]||'')} · ${esc(z.dn||'')}</div><div class="t">ЖК «${esc(z.n)}»</div><div class="a">${esc(z.addr||'')}</div><table>
  ${r('Застройщик',z.dev)}${r('Метро',z.metro?(z.metro+(z.wm?', '+z.wm+' мин пешком':'')):'')}${r('Цена за м²',zPrice(z))}${r('Квартиры',lots)}${r('Срок сдачи',z.due)}${r('Этажность',z.fl?'до '+z.fl:'')}${r('Отделка',z.fin)}${r('Квартир в ЖК',z.flats?String(z.flats):'')}${r('В продаже',z.cnt?z.cnt+' кв. на ЦИАН':'')}</table>
  ${z.lc?`<div style="margin-top:6px"><a href="${esc(z.lc)}" target="_blank" rel="noopener">Открыть на ЦИАН</a></div>`:''}${z.exact?'':'<div class="w">Точка перенесена с карты ЖК, возможна погрешность до 100 м.</div>'}</div>`}

/* ---------- markers ---------- */
function buildMarkers(){
  DATA.kh.forEach((it,i)=>{const m=L.marker([it.lat,it.lon],{icon:icon(it.n,CATCOL[it.cat],it.approx),riseOnHover:true}).bindPopup(()=>popKh(it));m._it=it;markers.kh.push(m)});
  DATA.lub.forEach(b=>{const m=L.marker([b.lat,b.lon],{icon:L.divIcon({className:'',html:`<div class="bmk">${b.id}</div>`,iconSize:[36,26],iconAnchor:[18,13],popupAnchor:[0,-13]}),zIndexOffset:500,riseOnHover:true}).bindPopup(()=>popB(b),{maxWidth:320});m._b=b;markers.lu.push(m)});
  DATA.lu.filter(x=>x.lat).forEach(it=>{const m=L.marker([it.lat,it.lon],{icon:icon(it.n,LUCOL[luCat(it)]),riseOnHover:true}).bindPopup(()=>popLu(it));m._it=it;markers.lu.push(m)});
  ZHK.forEach(z=>{const s=z.kh?32:28;const m=L.marker([z.lat,z.lon],{icon:L.divIcon({className:'',html:`<div class="zmk${z.kh?' kh':''}" style="background:var(--k-${z.cat})">${HOUSE}</div>`,iconSize:[s,s],iconAnchor:[s/2,s],popupAnchor:[0,-s]}),zIndexOffset:1000,riseOnHover:true,title:'ЖК '+z.n}).bindPopup(()=>popZ(z),{maxWidth:320});m._z=z;markers.z.push(m)});
}
function visKh(it){return !off.has(it.cat)&&match(it.name+' '+it.addr+' '+it.sub+' '+it.n)}
function visLu(it){const c=luCat(it);const t=it.name+' '+it.sub+' '+it.n;if((c==='kids'||it.kids)&&!off.has('kids'))return match(t);return !off.has(c)&&match(t)}
function zFiltered(){return pLo>0||pHi<1000}
function visZ(z){if(zOff.has(z.cat))return false;
  if(zFiltered()){if(!z.pa)return false;const lo=vToP(pLo),hi=vToP(pHi);if(z.pa<lo||z.pa>hi)return false}
  if(zDue.size&&z.dy){if(ZDUE.some(d=>zDue.has(d[0])&&d[2](z.dy)))return false}
  return match('жк '+z.n+' '+(z.dev||'')+' '+(z.addr||'')+' '+(z.metro||'')+' '+(z.dn||''))}
function zSorted(){return ZHK.filter(visZ).sort((a,b)=>(b.kh-a.kh)||((b.pa||0)-(a.pa||0)))}

function refreshMap(){
  Object.values(layer).forEach(l=>{l.clearLayers();map.removeLayer(l)});
  if(showI){
    if(tab==='kh'){markers.kh.forEach(m=>{if(visKh(m._it))layer.kh.addLayer(m)});layer.kh.addTo(map)}
    else{markers.lu.forEach(m=>{if(m._b){if(m._b.items.some(n=>(LUBY[n]||[]).some(visLu)))layer.lu.addLayer(m)}else if(visLu(m._it))layer.lu.addLayer(m)});layer.lu.addTo(map)}
  }
  if(showZ){markers.z.forEach(m=>{if(visZ(m._z))layer.z.addLayer(m)});layer.z.addTo(map)}
  zStatus();
}

/* ---------- controls ---------- */
function chipBtn(name,col,ct,on,fn,shape){const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',on);
  b.innerHTML=`${col?`<span class="dot" style="background:var(${col});${shape==='sq'?'border-radius:3px':''}"></span>`:''}${esc(name)}${ct!=null?` <span class="ct">${ct}</span>`:''}`;b.onclick=()=>{fn();b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};return b}
function chips(){
  const el=document.getElementById('chips');el.innerHTML='';el.hidden=!showI;
  const defs=tab==='kh'?Object.keys(DATA.cats).map(k=>[k,DATA.cats[k],CATCOL[k],DATA.kh.filter(x=>x.cat===k).length])
    :Object.keys(LUNAME).map(k=>[k,LUNAME[k],LUCOL[k],DATA.lu.filter(x=>k==='kids'?(luCat(x)==='kids'||x.kids):luCat(x)===k).length]);
  defs.forEach(([k,name,col,ct])=>el.appendChild(chipBtn(name,col,ct,!off.has(k),()=>{off.has(k)?off.delete(k):off.add(k);refreshMap();list()})));
}
function zControls(){
  const c=document.getElementById('zf-cls');c.innerHTML='';
  ZCLS.forEach(([k,n])=>{const ct=ZHK.filter(z=>z.cat===k).length;if(!ct)return;c.appendChild(chipBtn(n,'--k-'+k,ct,!zOff.has(k),()=>{zOff.has(k)?zOff.delete(k):zOff.add(k);refreshMap();list()},'sq'))});
  const d=document.getElementById('zf-due');d.innerHTML='';
  ZDUE.forEach(([k,n,f])=>{const ct=ZHK.filter(z=>z.dy&&f(z.dy)).length;d.appendChild(chipBtn(n,'--muted',ct,!zDue.has(k),()=>{zDue.has(k)?zDue.delete(k):zDue.add(k);refreshMap();list()}))});
  priceUI();
}
function priceUI(){const lo=document.getElementById('zf-lo'),hi=document.getElementById('zf-hi');lo.value=pLo;hi.value=pHi;
  document.getElementById('zf-pv').textContent=`${fmtN(vToP(pLo))} – ${fmtN(vToP(pHi))} тыс. ₽`;
  const f=document.getElementById('zf-fill');f.style.left=`calc(9px + (100% - 18px) * ${pLo/1000})`;f.style.width=`calc((100% - 18px) * ${(pHi-pLo)/1000})`}
['zf-lo','zf-hi'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{let v=+e.target.value;
  if(id==='zf-lo'){pLo=Math.min(v,pHi-20)}else{pHi=Math.max(v,pLo+20)}priceUI();refreshMap();list()}));
document.getElementById('zf-reset').onclick=()=>{zOff.clear();zDue.clear();pLo=0;pHi=1000;zControls();refreshMap();list()};
function zStatus(){const n=ZHK.filter(visZ).length;const act=zOff.size||zDue.size||zFiltered();document.getElementById('zf-st').textContent=act?`показано ${n} из ${ZHK.length}`:`все ${ZHK.length}`}

function focus(m){if(!m)return;const ll=m.getLatLng();map.flyTo(ll,Math.max(map.getZoom(),16),{duration:.6});setTimeout(()=>m.openPopup(),650);
  if(window.matchMedia('(max-width:760px)').matches)document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth'})}
function rowHtml(n,col,name,ad,ap){return `<span class="badge" style="background:var(${col})">${n}</span><span><span class="nm">${esc(name)}</span>${ap?'<span class="tag">примерно</span>':''}<br><span class="ad">${esc(ad)}</span></span>`}
function group(key,title,col,count,fill){
  const d=document.createElement('details');d.className='grp';d.open=open.has(key)||!!q;
  d.innerHTML=`<summary>${col?`<span class="dot" style="background:var(${col})"></span>`:''}${esc(title)}<span class="ct">${count}</span></summary><div class="inner"></div>`;
  d.addEventListener('toggle',()=>{if(q)return;d.open?open.add(key):open.delete(key)});
  fill(d.querySelector('.inner'));return d}
function btnRow(html,fn){const r=document.createElement('button');r.className='row';r.innerHTML=html;r.onclick=fn;return r}
function list(){
  const el=document.getElementById('list');el.innerHTML='';let shown=0;
  if(showZ){const zs=zSorted();if(zs.length){shown+=zs.length;
    el.appendChild(group('zhk','Жилые комплексы',null,zs.length,inner=>{
      const add=(arr,h)=>{if(!arr.length)return;const hh=document.createElement('h3');hh.textContent=h;inner.appendChild(hh);
        arr.forEach(z=>inner.appendChild(btnRow(`<span class="zbadge" style="background:var(--k-${z.cat})">${HOUSE}</span><span><span class="nm">${esc(z.n)}</span><br><span class="ad">${esc(ZCN[z.cat]||'')}${z.pa?' · '+fmtN(z.pa)+' тыс. ₽/м²':''}${z.due?' · '+esc(z.due):''}</span></span>`,()=>focus(markers.z.find(m=>m._z===z)))))};
      add(zs.filter(z=>z.kh),'В Хамовниках');add(zs.filter(z=>!z.kh),'Рядом с районом');}))}}
  if(showI){
  if(tab==='kh'){
    Object.keys(DATA.cats).forEach(k=>{if(off.has(k))return;
      const ms=markers.kh.filter(m=>m._it.cat===k&&visKh(m._it));
      const un=DATA.unplaced.filter(x=>x.cat===k&&match(x.name+' '+x.sub+' '+x.n));
      const total=new Set(ms.map(m=>m._it.n).concat(un.map(x=>x.n))).size;if(!total)return;shown+=total;
      el.appendChild(group(k,DATA.cats[k],CATCOL[k],total,inner=>{
        let sub=null;const seen=new Set();
        ms.forEach(m=>{const it=m._it;if(it.sub!==sub&&k!=='parks'){sub=it.sub;const h=document.createElement('h3');h.textContent=sub;inner.appendChild(h)}
          const dup=seen.has(it.n);seen.add(it.n);inner.appendChild(btnRow(rowHtml(it.n,CATCOL[k],it.name+(dup?' (ещё адрес)':''),it.addr,it.approx),()=>focus(m)))});
        if(un.length){const h=document.createElement('h3');h.textContent='Без отметки на печатной карте';inner.appendChild(h);
          un.forEach(it=>{const r=document.createElement('div');r.className='row';r.style.cursor='default';r.innerHTML=rowHtml(it.n,CATCOL[k],it.name,it.sub,0);inner.appendChild(r)})}}))});
  }else{
    const bl=DATA.lub.map(b=>[b,b.items.flatMap(n=>LUBY[n]||[]).filter(visLu)]).filter(x=>x[1].length);
    if(bl.length){shown+=bl.length;el.appendChild(group('lub','Здания комплекса',null,bl.length,inner=>{
      bl.forEach(([b,its])=>{const names=[...new Set(its.map(x=>x.name.replace(/^[^:]+: /,'')))];const n=its.length;
        const w=n%10===1&&n%100!==11?'услуга':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'услуги':'услуг');
        inner.appendChild(btnRow(`<span class="rn">${b.id}</span><span><span class="nm">${esc(b.name)}</span><br><span class="ad">${n} ${w}: ${esc(names.slice(0,4).join(', '))}${names.length>4?'…':''}</span></span>`,()=>focus(markers.lu.find(x=>x._b===b))))})}))}
    const own=markers.lu.filter(m=>m._it&&visLu(m._it));
    Object.keys(LUNAME).forEach(k=>{const ms=own.filter(m=>luCat(m._it)===k);if(!ms.length)return;shown+=ms.length;
      el.appendChild(group('lu-'+k,k==='sport'?'Площадки и поля':LUNAME[k],LUCOL[k],ms.length,inner=>ms.forEach(m=>inner.appendChild(btnRow(rowHtml(m._it.n,LUCOL[k],m._it.name,m._it.sub,0),()=>focus(m))))))});
    const rest=DATA.lu.filter(x=>!x.lat&&!x.b&&visLu(x));
    if(rest.length)el.appendChild(group('lu-rest','Без точки на схеме',null,rest.length,inner=>rest.forEach(it=>{const r=document.createElement('div');r.className='row';r.innerHTML=rowHtml(it.n,LUCOL[luCat(it)],it.name,'ОК «Лужники»',0);inner.appendChild(r)})));
  }}
  if(!shown)el.insertAdjacentHTML('afterbegin','<div class="empty">Ничего не найдено. Измените запрос, фильтр или включите слои.</div>');
  el.insertAdjacentHTML('beforeend',tab==='kh'
    ?`<div class="note"><span><b>Номера</b> совпадают с печатной картой района (январь 2026).</span><span><b>Пунктирная обводка</b>: адрес не подтвердился, точка стоит по квадрату печатной карты.</span><span><b>ЖК</b>: данные и цены из карты ЖК Миррион.</span><span>Подложка: © участники OpenStreetMap.</span></div>`
    :`<div class="note"><span><b>Римские цифры</b>: здания комплекса, внутри список всех клубов и услуг.</span><span><b>Арабские цифры</b>: поля, корты, кафе и площадки.</span><span>Подложка: © участники OpenStreetMap.</span></div>`);
}
function legend(){const z=showZ?`<span><i style="background:var(--k-dlx);border-radius:4px 4px 4px 1px;transform:rotate(-45deg)"></i>Жилой комплекс</span>`:'';
  document.getElementById('legend').innerHTML=z+(!showI?'':tab==='kh'
  ?`<span><i style="background:var(--c-food);border:2px solid var(--panel)"></i>Точный адрес</span><span><i style="background:var(--c-food);border:2px dashed var(--ink)"></i>Примерное место</span>`
  :`<span><i style="background:var(--ink);border-radius:3px"></i>Здание комплекса</span><span><i style="background:var(--c-sport);border:2px solid var(--panel)"></i>Площадка, кафе</span>`)}
const VIEW={kh:[[55.705,37.535],[55.752,37.615]],lu:[[55.7080,37.5395],[55.7250,37.5710]]};
function setTab(t,fit=true){tab=t;off.clear();
  document.getElementById('tab-kh').setAttribute('aria-pressed',t==='kh');document.getElementById('tab-lu').setAttribute('aria-pressed',t==='lu');
  document.getElementById('title').textContent=t==='kh'?'Хамовники':'Лужники';
  document.getElementById('subtitle').textContent=t==='kh'?'Жилые комплексы и инфраструктура района: парки, рестораны, школы, спорт и культура.':'Олимпийский комплекс: 16 зданий и десятки площадок для спорта, отдыха и детей.';
  try{history.replaceState(null,'',t==='lu'?'#luzhniki':'#')}catch(e){}
  chips();refreshMap();list();legend();if(fit)map.fitBounds(VIEW[t],{padding:[10,10]})}
function layerBtn(id,get,set){const b=document.getElementById(id);b.onclick=()=>{set(!get());b.setAttribute('aria-pressed',get());document.getElementById('zf').hidden=!showZ;chips();refreshMap();list();legend()}}
layerBtn('ly-z',()=>showZ,v=>showZ=v);layerBtn('ly-i',()=>showI,v=>showI=v);
document.getElementById('tab-kh').onclick=()=>setTab('kh');document.getElementById('tab-lu').onclick=()=>setTab('lu');
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();refreshMap();list()});
document.getElementById('cnt-kh').textContent=new Set(DATA.kh.map(x=>x.n)).size+DATA.unplaced.length;
document.getElementById('cnt-lu').textContent=DATA.lu.length;
document.getElementById('cnt-z').textContent=ZHK.length;

map.fitBounds(VIEW.kh);
drawBase();buildMarkers();zControls();
setTab(location.hash==='#luzhniki'?'lu':'kh');
const mq=window.matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',drawBase);
new MutationObserver(drawBase).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
